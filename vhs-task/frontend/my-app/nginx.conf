# Cookie của localhost dùng chung mọi cổng (cookie các app khác gửi kèm) → nới giới hạn header, mặc định 8k gây lỗi 400
large_client_header_buffers 4 32k;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # API, file upload, SignalR → container api (cùng domain với web, không cần CORS / domain riêng cho API)
    location ~ ^/(api|uploads|notificationHub)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 20m;   # hợp đồng tối đa 20MB
    }
}
