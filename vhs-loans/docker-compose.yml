services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-10081}:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      KETOAN_PASSWORD: ${KETOAN_PASSWORD:-}
      HTTPS: ${HTTPS:-0}
      HUB_URL: ${HUB_URL:-}
    volumes:
      - loans-data:/app/data

# Tên cố định → chạy compose ở thư mục nào cũng dùng chung dữ liệu
volumes:
  loans-data:
    name: vhs-loans-data
