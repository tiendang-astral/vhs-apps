<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHS Applications</title>
<style>
  :root {
    --bg: #eceef2;
    --text: #1a1d23;
    --muted: rgba(26, 29, 35, .55);
    --glass: rgba(255, 255, 255, .4);
    --glass-border: rgba(255, 255, 255, .75);
    --tile: rgba(255, 255, 255, .65);
    --tile-border: rgba(255, 255, 255, .9);
    --shadow: 0 24px 64px rgba(20, 24, 40, .1);
    --tile-shadow: 0 8px 20px rgba(20, 24, 40, .08);
    --blob1: #c3cfe6; --blob2: #d5dbe8; --blob3: #cfd9ea;
    --accent: #1e3a8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1015;
      --text: #eceef2;
      --muted: rgba(236, 238, 242, .5);
      --glass: rgba(255, 255, 255, .04);
      --glass-border: rgba(255, 255, 255, .09);
      --tile: rgba(255, 255, 255, .07);
      --tile-border: rgba(255, 255, 255, .12);
      --shadow: 0 24px 64px rgba(0, 0, 0, .4);
      --tile-shadow: 0 8px 20px rgba(0, 0, 0, .3);
      --blob1: #1a2744; --blob2: #222838; --blob3: #1b2a40;
      --accent: #93b4f5;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
  }

  /* Nền: các khối màu trung tính, trôi rất chậm */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg span {
    position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
    filter: blur(100px); animation: drift 40s ease-in-out infinite alternate;
  }
  .bg span:nth-child(1) { background: var(--blob1); top: -25vmax; left: -15vmax; }
  .bg span:nth-child(2) { background: var(--blob2); bottom: -30vmax; right: -15vmax; animation-delay: -13s; }
  .bg span:nth-child(3) { background: var(--blob3); top: 30%; left: 35%; width: 40vmax; height: 40vmax; animation-delay: -26s; }
  @keyframes drift { to { transform: translate(4vmax, -3vmax); } }

  main { width: 100%; max-width: 1040px; padding: 56px 16px; }

  h1 {
    margin: 0 0 40px; text-align: center;
    font-size: clamp(2rem, 6vw, 3rem); font-weight: 300; letter-spacing: -.02em;
    animation: fade .6s ease-out both;
  }

  .panel {
    padding: clamp(32px, 6vw, 64px) clamp(20px, 5vw, 56px);
    min-height: 360px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 36px;
    backdrop-filter: blur(30px) saturate(140%);
    -webkit-backdrop-filter: blur(30px) saturate(140%);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .3);
    animation: fade .6s .1s ease-out both;
  }

  .grid { display: grid; gap: 40px 16px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); justify-items: center; }

  a.app {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    width: 120px; color: inherit; text-decoration: none; border-radius: 24px; padding: 4px 0;
    animation: fade .5s ease-out both;
    animation-delay: calc(.2s + var(--i) * .05s);
    -webkit-tap-highlight-color: transparent;
  }
  .icon {
    width: 88px; height: 88px; border-radius: 26px;
    display: grid; place-items: center;
    background: var(--tile);
    border: 1px solid var(--tile-border);
    box-shadow: var(--tile-shadow), inset 0 1px 0 rgba(255, 255, 255, .4);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  /* Icon Lucide tô bằng màu chủ đạo qua mask */
  .icon i { width: 38px; height: 38px; background: var(--accent); -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }
  .name { font-size: .95rem; font-weight: 500; text-align: center; line-height: 1.3; }

  a.app:hover .icon, a.app:focus-visible .icon { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(20, 24, 40, .12), inset 0 1px 0 rgba(255, 255, 255, .4); }
  a.app:active .icon { transform: scale(.96); }
  a.app:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }

  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

<main>
  <h1>VHS Applications</h1>
  <section class="panel">
    <nav class="grid" id="grid"></nav>
  </section>
</main>

<script>
  // Danh sách app nằm trong apps.txt (sinh từ biến APP_1, APP_2... trong .env), mỗi dòng: Tên|URL|icon
  // ponytail: icon tải từ CDN jsdelivr — tự host lucide-static nếu VPS không ra được internet.
  const grid = document.getElementById("grid");
  fetch("apps.txt", { cache: "no-cache" })
    .then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(text => text.split("\n").map(l => l.split("|").map(s => s.trim())).filter(([name, url]) => name && url)
      .forEach(([name, url, icon = "app-window"], i) => {
        const a = document.createElement("a");
        a.className = "app"; a.href = url; a.style.setProperty("--i", i);
        a.innerHTML = '<span class="icon"><i aria-hidden="true"></i></span><span class="name"></span>';
        a.querySelector("i").style.setProperty("--src", `url(https://cdn.jsdelivr.net/npm/lucide-static/icons/${encodeURIComponent(icon || "app-window")}.svg)`);
        a.querySelector(".name").textContent = name;
        grid.append(a);
      }))
    .catch(() => grid.textContent = "Không tải được danh sách ứng dụng.");
</script>
</body>
</html>
